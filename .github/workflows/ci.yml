name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: python -m compileall -q src dashboard.py daily_learn.py main.py
      - run: python -m ruff check . --exclude data --exclude TRACK_RECORD.csv
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tests/golden_backtest.py
